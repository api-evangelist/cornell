  - date: '2026-08-19'
    rating: 2
    summary: >-
      University-pipeline re-profile, run for operator attribution rather than artifact volume, and
      it lowers this profile deliberately. Three findings. (1) The seven refined OpenAPIs in this repo
      were a WELD: five Cornell Open Data Initiative specs describing five different hosts had been
      split by tag and re-based onto a single servers[] entry, https://classes.cornell.edu/api/2.0, so
      Cornell Dining's /config/pages.json and Localist's /events/search were being scored as Class
      Roster paths. (2) Three of those five surfaces are dead — the dining API returns the same 63KB
      Angular shell on every path, the Cornell Days API 301s to admissions.cornell.edu, and the campus
      map API 404s — and a fourth, the events calendar, is a Localist (Concept3D) tenancy, proven by
      the x-slzr-platform response header. (3) arXiv left Cornell: it spun out as an independent
      nonprofit on 2026-07-01 and is no longer a Cornell surface, so it was removed. What survives is
      genuinely Cornell's and was verified live: the Class Roster API, the Library's self-hosted
      Blacklight catalog, CUGIR, the Shibboleth/InCommon SAML metadata, and the Cornell Lab of
      Ornithology's token-gated eBird API. eCommons stays, re-labelled tenant — Cornell's repository
      on a 4Science-managed DSpace instance.
