apis:
- aid: cornell:class-roster
  name: Cornell Class Roster API
  description: >-
    Public read-only API (version 2.0) for Cornell Class Roster data, providing scheduled classes with
    Course of Study details plus configuration lookups for rosters, academic careers, academic groups,
    class levels, and subjects. All methods are GET and return XML or JSON. Usage should be limited to
    no more than one request per second.
  humanURL: https://classes.cornell.edu/content/FA25/api-details
  baseURL: https://classes.cornell.edu/api/2.0/
