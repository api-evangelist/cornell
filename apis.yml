    an AWS load balancer in Cornell University Library's own account — self-hosted open-source software,
    not a vendor tenancy. Probed 2026-08-19: /catalog.json 200 application/json, /catalog/opensearch.xml
    200. The HTML root returns 202 with an empty body to non-browser clients (bot challenge); the JSON
