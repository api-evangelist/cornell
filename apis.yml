apis:
- aid: cornell:class-roster
  name: Cornell Class Roster API
  description: >-
    Public, read-only API (version 2.0) for Cornell Class Roster data: scheduled classes with Course of
    Study detail, plus configuration lookups for rosters, academic careers, academic groups, class levels
    and subjects. All methods are GET and return JSON or XML. No authentication. The schedule behind it
    is maintained by the Cornell Office of the University Registrar and updated daily; the documentation
    asks clients to stay under one request per second. This is the one unambiguous, institution-engineered
    public API Cornell operates.
  humanURL: https://classes.cornell.edu/content/FA26/api-details
