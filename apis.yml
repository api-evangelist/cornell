- aid: cornell:ecommons
  name: eCommons Digital Repository (DSpace REST and OAI-PMH)
  description: >-
    eCommons is Cornell University Library's institutional repository, running on DSpace 7+. It exposes
    a public DSpace REST API for items, communities, collections, and bitstreams, and an OAI-PMH endpoint
    for metadata harvesting using Dublin Core. The library migrated to new DSpace infrastructure in January
    2026.
  humanURL: https://guides.library.cornell.edu/ecommons/syndication
  baseURL: https://ecommons.cornell.edu/server/api
  tags:
