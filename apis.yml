aid: cornell
name: Cornell University
description: >-
  Cornell University is a private Ivy League and statutory land-grant research university in
  Ithaca, New York. It operates no central developer portal, no API gateway and no published
  API program, and this profile records that plainly. What it does operate, directly and on its
  own hosts, is a small set of real machine-readable surfaces: the Class Roster API on
  classes.cornell.edu (public, read-only, version 2.0, maintained behind the scenes by the Office
  of the University Registrar), the Cornell University Library's self-hosted Blacklight catalog and
  CUGIR geospatial repository, both of which answer JSON on every route, its own Shibboleth
  identity provider published as SAML 2.0 metadata and registered with InCommon/eduGAIN, and — through
  the Cornell Lab of Ornithology — the token-gated eBird API 2.0. Everything else that looks like a
  Cornell API belongs to somebody else: the events calendar at events.cornell.edu is a Localist
  tenancy, eCommons is a 4Science-managed DSpace instance, and arXiv, hosted at Cornell for
  twenty-five years, spun out as an independent nonprofit on 2026-07-01 and is no longer a Cornell
  surface at all. The Cornell Open Data Initiative specs that once padded this profile described a
  dining API, a campus-map API and a Cornell Days API that are all dead as of 2026-08-19.
