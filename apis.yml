- aid: cornell:events-calendar
  name: Cornell Events Calendar API (Localist) — tenant
  description: >-
    The Cornell events calendar at events.cornell.edu answers a live JSON API at /api/2/events, and the
    data is Cornell's. The platform is Localist (Concept3D): the response headers carry x-slzr-platform:
    cornell, and the /api/2 shape is Localist's product API, identical across every Localist customer.
    The contract therefore belongs to Localist and is not saved here — this is the exact misattribution
    class the university pipeline exists to prevent. The 2026-06 profile of this repo scored a copy of
    it as "Cornell University events API".
  humanURL: https://events.cornell.edu/
  baseURL: https://events.cornell.edu/api/2
  x-operator: tenant
  x-operator-evidence: >-
    Probed 2026-08-19: GET https://events.cornell.edu/api/2/events 200 application/json with response
    header `x-slzr-platform: cornell` — Localist's platform header ("slzr" = Schedulizer, Localist's origin).
