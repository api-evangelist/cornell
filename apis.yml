x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Cornell operates four public machine-readable surfaces that were verified live on 2026-08-19 —
    the Class Roster API, the Library's Blacklight catalog, CUGIR, and (through the Cornell Lab of
    Ornithology, on an affiliate domain) the token-gated eBird API 2.0 — plus its own Shibboleth/InCommon
    SAML metadata. It publishes no developer portal, no API gateway, no terms of service for API use and
    no OpenAPI of its own; the only OpenAPI ever written for a Cornell surface was written by the student
    Cornell Open Data Initiative. Two further surfaces are tenant relationships on vendor platforms
    (eCommons on 4Science-managed DSpace, the events calendar on Localist) and their contracts are not
    credited to Cornell. Three CODI-described surfaces are dead and were removed. arXiv was removed
    entirely: it left Cornell on 2026-07-01.
