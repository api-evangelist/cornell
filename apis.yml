- aid: cornell:ecommons
  name: eCommons Institutional Repository (DSpace REST + OAI-PMH) — tenant
  description: >-
    eCommons is Cornell University Library's institutional repository: Cornell's content, Cornell's DOIs,
    Cornell's host. The interface is not Cornell's engineering. It runs DSpace 8.2 on a 4Science-managed
    platform, so the REST and OAI-PMH contracts belong to DSpace/4Science and are deliberately NOT saved
    as Cornell OpenAPIs. The relationship is recorded because a managed repository is a real institutional
    fact and one of the few programmable surfaces a university has. OAI-PMH Identify and ListMetadataFormats
    both answer 200 and are the repository's genuine education-regime conformance evidence.
