- aid: cornell:library-catalog
  name: Cornell University Library Catalog Search API
  description: >-
    JSON search over Cornell University Library's catalog. The catalog is the library's own Blacklight
    deployment; appending .json to any catalog route returns a Solr-backed JSON envelope, and an OpenSearch
    description document is published at /catalog/opensearch.xml. Cornell publishes no API reference for
    it, so the contract in this repo is derived from live probes, not from a Cornell-authored spec. Item-level
    JSON is not offered (406).
  humanURL: https://www.library.cornell.edu/
  baseURL: https://catalog.library.cornell.edu
  x-operator: institution
