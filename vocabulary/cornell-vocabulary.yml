vocabulary:
  name: Cornell University Institution-Operated API Vocabulary
  description: >-
    Controlled terms drawn ONLY from surfaces Cornell University itself operates: the Class Roster
    API (classes.cornell.edu), the Cornell University Library catalog (Blacklight) and CUGIR, the
    Cornell University Geospatial Information Repository (GeoBlacklight). The 2026-06 version of
    this file also carried dining, campus-map, Cornell Days and Localist event terms; those were
    removed on 2026-08-19 because their surfaces are either dead (now.dining.cornell.edu and
    www.cornell.edu/about/maps return an SPA shell / 404, schedule.cornelldays.cornell.edu 301s to
    admissions.cornell.edu) or vendor-operated (events.cornell.edu is a Localist tenancy).
  version: '0.2'
  terms:
    - term: Roster
      definition: A published academic term of the Class Roster, e.g. FA26, identified by a slug and strm code.
      tags: [class-roster, scheduling]
    - term: strm
      definition: Numeric term code identifying a specific roster/term in the Class Roster API.
      tags: [class-roster]
    - term: crseId
      definition: Unique course identifier for a class in the Class Roster API.
      tags: [class-roster]
    - term: catalogNbr
      definition: Catalog number of a course, e.g. 1110, within a subject.
      tags: [class-roster, catalog]
    - term: acadCareer
      definition: Academic career classification such as UG (undergraduate) or GR (graduate).
      tags: [class-roster]
    - term: acadGroup
      definition: Academic group (college/school) offering the class, e.g. EN for Engineering.
      tags: [class-roster]
    - term: classLevel
      definition: Class standing filter (e.g. 1000-level, 2000-level) exposed by the Class Roster config lookups.
      tags: [class-roster]
    - term: subject
      definition: Subject code, e.g. CS, required by the Class Roster search method.
      tags: [class-roster]
    - term: enrollGroups
      definition: Enrollment groupings within a class describing sections and components.
      tags: [class-roster, enrollment]
    - term: search_field
      definition: Blacklight search field selector in the Library catalog API, e.g. all_fields, title, author.
      tags: [library-catalog, blacklight]
    - term: document
      definition: One catalog record inside the Blacklight `response.document[]` array.
      tags: [library-catalog, blacklight]
    - term: dct_creator_sm
      definition: Aardvark/GeoBlacklight creator field on a CUGIR record.
      tags: [cugir, geospatial, aardvark]
    - term: dct_spatial_sm
      definition: Aardvark/GeoBlacklight spatial-coverage field used to facet CUGIR records by place.
      tags: [cugir, geospatial, aardvark]
    - term: CUGIR record id
      definition: CUGIR item identifier, e.g. cugir-map-5063364, addressable at /catalog/{id}.json.
      tags: [cugir, geospatial]
